<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0e24" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Chaty" />
    <title>Chaty</title>
    <script>
      // Day or night and the colour palette, before the first paint (see
      // src/lib/theme.ts, whose PALETTES has the same bar colours).
      try {
        var t = localStorage.getItem('chaty.theme');
        var light = t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
        var bars = {
          twilight: ['#0a0e24', '#3b8fe8'],
          ocean: ['#021220', '#0c86dc'],
          forest: ['#021512', '#3189da'],
          sunset: ['#1c0a08', '#2c83d4'],
          sakura: ['#1c0914', '#5d93e2'],
          graphite: ['#07090c', '#8092a6'],
        };
        var p = localStorage.getItem('chaty.palette');
        if (!Object.prototype.hasOwnProperty.call(bars, p)) p = 'twilight';
        document.documentElement.dataset.palette = p;
        if (light) document.documentElement.dataset.theme = 'light';
        document.querySelector('meta[name="theme-color"]').setAttribute('content', bars[p][light ? 1 : 0]);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
