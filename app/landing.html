<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e24" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Chaty — messages, voice and video calls under a calm night sky. Use it in your browser or install the Android app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Chaty</title>
    <script>
      // Day or night before the first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem('chaty.theme');
        if (t === 'light' || (t === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#3b8fe8');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.tsx"></script>
  </body>
</html>
